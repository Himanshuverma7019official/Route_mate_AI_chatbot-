services:
  - type: web
    name: routemate-ai
    runtime: python
    rootDir: AI_Navigation_Chatbot/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: DATABASE_URL
        sync: false
